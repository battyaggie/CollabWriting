# Reverse proxy example (nginx). Adapt to your standard setup; the essential parts are
# the WebSocket upgrade for /ws and the forwarded client address.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl;
    server_name writing.example.at;                 # CHANGE
    ssl_certificate     /etc/ssl/writing.example.at.pem;
    ssl_certificate_key /etc/ssl/writing.example.at.key;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # the app trusts this when TRUST_PROXY=1
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;          # WebSocket
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;                         # the app sends a keep-alive every 25 s
    }
}
